name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          cache: true

      # 🔑 RENAME PROJECT FOLDER (CORRECT PATH)
      - name: Rename project directory for Dart
        run: |
          mv audio-cinema-studio audio_cinema_studio

      - name: Flutter doctor
        run: flutter doctor -v
        working-directory: audio_cinema_studio

      - name: Flutter pub get
        run: flutter pub get
        working-directory: audio_cinema_studio

      - name: Generate Android platform
        run: flutter create .
        working-directory: audio_cinema_studio

      - name: Build APK (debug)
        run: flutter build apk --debug
        working-directory: audio_cinema_studio

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: audio-cinema-studio-apk
          path: audio_cinema_studio/build/app/outputs/flutter-apk/app-debug.apk
