name: Flutter Android Debug Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout source
        uses: actions/checkout@v4

      # 2️⃣ Set up Flutter (stable)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 3️⃣ Verify Flutter
      - name: Flutter doctor
        run: flutter doctor -v

      # 4️⃣ Ensure clean state (android folder may not exist)
      - name: Remove android folder if present
        run: |
          rm -rf android || true

      # 5️⃣ REGENERATE ANDROID PLATFORM (KEY STEP)
      - name: Regenerate Android platform
        run: |
          flutter create --platforms=android --project-name audio_cinema_studio .

      # 6️⃣ Get Dart dependencies
      - name: Flutter pub get
        run: flutter pub get

      # 7️⃣ Build DEBUG APK
      - name: Build debug APK
        run: flutter build apk --debug

      # 8️⃣ Upload APK artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: audio-cinema-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
