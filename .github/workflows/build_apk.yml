name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Flutter pub get
        run: flutter pub get

      # 🔑 CREATE TEMP PROJECT (VALID NAME)
      - name: Generate Android platform safely
        run: |
          flutter create audio_cinema_tmp
          rm -rf android
          cp -r audio_cinema_tmp/android .
          rm -rf audio_cinema_tmp

      - name: Build APK (debug)
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: audio-cinema-studio-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
